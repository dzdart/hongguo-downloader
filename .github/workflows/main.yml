name: Build Release Package

on:
  push:
    tags:
      - 'v*'          # 打 tag 时自动构建并发布 Release
  workflow_dispatch:  # 也可以在 Actions 页面手动触发

permissions:
  contents: write      # 创建 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React app
        run: npm run build        # 输出到 dist-react/

      - name: Verify Python syntax
        run: python3 -m py_compile app.py hongguo.py store.py

      - name: Prepare build directory
        run: |
          rm -rf build
          mkdir -p build
          # Python 后端源码
          cp app.py hongguo.py store.py requirements.txt build/
          # 前端构建产物（app.py 在同级目录查找 dist-react）
          cp -r dist-react build/dist-react
          # 附上说明与许可证
          cp README.md LICENSE build/

      - name: Create zip package
        run: zip -r "hongguo-downloader-${{ github.ref_name }}.zip" build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguo-downloader-${{ github.ref_name }}
          path: hongguo-downloader-${{ github.ref_name }}.zip
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: hongguo-downloader-${{ github.ref_name }}.zip
          generate_release_notes: true
